name: Ingest ECMWF forecast data

on:
  schedule:
    # Now check-then-fetch (see ingest.py): each run does a cheap
    # metadata-only availability check per dataset and only pays for a
    # full download if something's actually new, so running this often
    # is safe and cheap -- unlike the old twice-daily heavy-fetch
    # schedule, being late by 15 minutes here just means the NEXT check
    # (15 min later) catches up, not a wait until the next 6-hour slot.
    #
    # Chasing every run (00/06/12/18Z), not just 00Z/12Z, per the
    # deliberate choice to trade a stable always-15-day range for
    # fresher updates 4x/day -- the "Full N-day forecast" section will
    # legitimately show 6 days for a few hours after a 06Z/18Z run,
    # until the next 00Z/12Z run arrives (the app already has UI
    # messaging for this, see the capped_to_day6 caption).
    #
    # Dense checks (every 15 min) inside each dissemination window. The
    # 0.25-degree product lands at about (see _dissemination_available_time()
    # in ecmwf_client.py, times are estimates):
    #   00Z -> ~07:40 UTC   06Z -> ~13:20 UTC   12Z -> ~19:40 UTC   18Z -> ~01:20 UTC
    # and the 0.1-degree product about two hours after that:
    #   00Z -> ~09:40 UTC   06Z -> ~15:20 UTC   12Z -> ~21:40 UTC   18Z -> ~03:20 UTC
    # ECMWF's own listing shows the 0.1-degree member files (pf) appearing
    # ~2h after the 0.25 release and the 0.1-degree probability files (ep)
    # ~20 min after that (00Z run: 09:40 and 10:01 UTC). Each window below
    # runs from just before the 0.25 release to about 1h45 past the 0.1 ep
    # file, so a late release doesn't fall outside it.
    - cron: "*/15 7-11 * * *"
    - cron: "*/15 13-17 * * *"
    - cron: "*/15 19-23 * * *"
    - cron: "*/15 1-5 * * *"
    # Sparse hourly fallback for the remaining hours (offset to :17 -- the
    # top of the hour is GitHub's highest-delay-risk time for scheduled jobs).
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force a full refetch of every dataset, ignoring the check-then-fetch skip logic (use after a storage-format change, e.g. this one)"
        type: boolean
        default: false

permissions:
  contents: write  # needed to push to the `data` branch below

# Prevents overlapping runs. A genuine full fetch can now take up to the
# full timeout (see above), while scheduled triggers fire every 15
# minutes -- without this, a slow run could still be mid-download when
# the next trigger starts a second one, racing on the same ./output
# checkout and the same `data` branch push. cancel-in-progress: false
# queues instead of killing an in-progress run, rather than wasting a
# large partial download -- safe to queue here specifically because
# check-then-fetch makes a queued run that finds nothing new resolve
# almost instantly once its turn comes, so this can't build an unbounded
# backlog, only a short queue during an actual data-change event.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 0.1-degree member data is ~6x the volume of 0.25-degree (tens of GB
    # of GRIB per full percentile + temperature refresh, fetched in small
    # batches), so a genuine full fetch can run far longer than before.
    # Generous on purpose; a run that finds nothing new still finishes in
    # seconds.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Checks out the CURRENT published state into ./output before
      # ingest.py runs, so datasets it decides not to refetch (nothing
      # new available) keep their existing files instead of vanishing
      # from the publish step below. continue-on-error covers the very
      # first run ever, before a `data` branch exists yet.
      - name: Check out existing published data
        uses: actions/checkout@v4
        with:
          ref: data
          path: output
        continue-on-error: true

      # The checkout above creates its own .git inside ./output (it's an
      # independent checkout, not a subfolder of the main one) -- remove
      # it so the publish step's own git operations on ./output don't
      # get confused by a nested repo.
      - name: Remove nested .git from the data-branch checkout
        run: rm -rf output/.git
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (eccodes, for GRIB decoding)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools

      - name: Install Python dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingestion
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: python ingest.py

      # Publishes ./output to a dedicated `data` branch as a single fresh
      # commit each run (force_orphan: true means no parent history, so
      # the branch never grows -- matches the "rolling latest only"
      # retention decision). No secrets needed beyond the token GitHub
      # Actions already provides automatically.
      - name: Publish to data branch
        if: always()  # publish whatever succeeded even if one of the two fetches failed (see ingest.py)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: data
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Update forecast data"
